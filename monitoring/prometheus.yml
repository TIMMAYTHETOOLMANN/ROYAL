global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'botcore-multiplatform'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Twitch Bot Metrics
  - job_name: 'botcore-twitch'
    static_configs:
      - targets: ['botcore-twitch:5000']
        labels:
          platform: 'twitch'
          service: 'botcore'
    metrics_path: /metrics
    scrape_interval: 10s

  # YouTube Bot Metrics
  - job_name: 'botcore-youtube'
    static_configs:
      - targets: ['botcore-youtube:5000']
        labels:
          platform: 'youtube'
          service: 'botcore'
    metrics_path: /metrics
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

