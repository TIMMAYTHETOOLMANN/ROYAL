## 🛠️ Management Commands

### View Logs
```powershell
# All platforms
docker-compose -f docker-compose.fortified.yml logs -f

# Twitch only
docker-compose -f docker-compose.fortified.yml logs -f botcore-twitch

# YouTube only
docker-compose -f docker-compose.fortified.yml logs -f botcore-youtube
```

### Scale Operations
```powershell
# Scale up
docker-compose -f docker-compose.fortified.yml up -d --scale botcore-twitch=1 --scale botcore-youtube=1

# Scale down specific platform
docker-compose -f docker-compose.fortified.yml scale botcore-twitch=0

# Restart specific platform
docker-compose -f docker-compose.fortified.yml restart botcore-youtube
```

### Complete Teardown
```powershell
docker-compose -f docker-compose.fortified.yml down -v --remove-orphans
```

